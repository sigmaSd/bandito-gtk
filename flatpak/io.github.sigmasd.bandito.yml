app-id: io.github.sigmasd.bandito

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: bandito-gtk

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network (needed for Deno.networkInterfaces and backends)
  - --share=network

  # Run netleash on the host (as you with its capabilities, or through pkexec)
  - --talk-name=org.freedesktop.Flatpak

modules:
  # ─── bandito-gtk (the app itself) ────────────────
  - name: bandito-gtk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/applications

      # Compile the Deno app
      - DENORT_BIN=$PWD/denort ./deno compile --no-check --output bandito-gtk --vendor --cached-only -A --unstable-raw-imports ./src/main.ts
      - install -Dm755 bandito-gtk /app/bin/bandito-gtk

      # Install desktop file
      - |
          cat > /app/share/applications/io.github.sigmasd.bandito.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Bandito GTK
          Comment=Network bandwidth monitor and traffic shaper
          Exec=bandito-gtk
          Icon=io.github.sigmasd.bandito
          Categories=System;Network;Settings;
          StartupNotify=true
          EOF

      # Install icon
      - install -Dm644 distro/io.github.sigmasd.bandito.svg /app/share/icons/hicolor/scalable/apps/io.github.sigmasd.bandito.svg

      # Install metainfo
      - mkdir -p /app/share/metainfo/
      - |
          cat > /app/share/metainfo/io.github.sigmasd.bandito.metainfo.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>io.github.sigmasd.bandito</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>Bandito GTK</name>
            <summary>Network bandwidth monitor and traffic shaper</summary>
            <description>
              <p>
                Bandito GTK shows how much each application downloads and uploads, and lets you
                limit any of them, or all of them at once, over IPv4 and IPv6. It measures and
                limits with netleash, which uses eBPF.
              </p>
              <ul>
                <li>Live rates and a short history for every application</li>
                <li>Download and upload limits per application, remembered across restarts</li>
                <li>The hosts and services each application is talking to</li>
                <li>Switch between networks from the header bar</li>
              </ul>
            </description>
            <screenshots>
              <screenshot type="default">
                <caption>Traffic per application, with limits on two of them</caption>
                <image>https://raw.githubusercontent.com/sigmaSd/bandito-gtk/3.0.0/distro/screenshots/main.png</image>
              </screenshot>
              <screenshot>
                <caption>Limiting an application and seeing its connections</caption>
                <image>https://raw.githubusercontent.com/sigmaSd/bandito-gtk/3.0.0/distro/screenshots/limits.png</image>
              </screenshot>
              <screenshot>
                <caption>Traffic that couldn't be matched to a program, in dark mode</caption>
                <image>https://raw.githubusercontent.com/sigmaSd/bandito-gtk/3.0.0/distro/screenshots/unidentified-dark.png</image>
              </screenshot>
            </screenshots>
            <url type="homepage">https://github.com/sigmaSd/bandito-gtk</url>
            <url type="bugtracker">https://github.com/sigmaSd/bandito-gtk/issues</url>
            <launchable type="desktop-id">io.github.sigmasd.bandito.desktop</launchable>
            <categories>
              <category>System</category>
              <category>Network</category>
            </categories>
            <content_rating type="oars-1.1"/>
            <provides>
              <binary>bandito-gtk</binary>
            </provides>
            <releases>
              <release version="3.2.0" date="2026-11-28">
                <description>
                  <p>Bandito shows each app's traffic by process, with netleash 0.3.0.</p>
                  <ul>
                    <li>When several processes in an app use the network, each gets a line under the app</li>
                    <li>The app's panel lists its processes, and marks the ones that exited</li>
                  </ul>
                </description>
              </release>
              <release version="3.1.3" date="2026-11-22">
                <description>
                  <p>Bandito starts a little faster, with jsGTK 0.75.</p>
                </description>
              </release>
              <release version="3.1.2" date="2026-11-22">
                <description>
                  <p>A Bandito binary for 64-bit ARM (aarch64) is released alongside the x86_64 one.</p>
                </description>
              </release>
              <release version="3.1.1" date="2026-11-22">
                <description>
                  <p>Bandito measures and limits traffic on 64-bit ARM (aarch64) too.</p>
                </description>
              </release>
              <release version="3.1.0" date="2026-11-22">
                <description>
                  <p>Bandito now measures and limits traffic with netleash, one eBPF helper.</p>
                  <ul>
                    <li>IPv6 traffic is limited too</li>
                    <li>Upload limits are paced instead of dropping packets</li>
                    <li>Apps are named by their application ID, so names and icons match</li>
                    <li>Less traffic shows up as unidentified</li>
                    <li>A shorter password prompt, or none when netleash has its capabilities</li>
                  </ul>
                </description>
              </release>
              <release version="3.0.2" date="2026-11-22">
                <description>
                  <p>The window responds right away to new traffic and wakes the CPU less while idle, with jsGTK 0.72.</p>
                </description>
              </release>
              <release version="3.0.1" date="2026-11-22">
                <description>
                  <p>The helper programs Bandito downloads are pinned to exact versions and checked before they run as root.</p>
                </description>
              </release>
              <release version="3.0.0" date="2026-11-22">
                <description>
                  <p>A redesign of the whole application.</p>
                  <ul>
                    <li>A summary of total traffic with a one-minute chart</li>
                    <li>Applications sorted by activity, with real names, icons and a 30-second history</li>
                    <li>A side panel for limits with presets, units and undo</li>
                    <li>Limits are remembered and applied again on start</li>
                    <li>Each application's connections, with hosts and services</li>
                    <li>A new icon</li>
                  </ul>
                </description>
              </release>
              <release version="2.0.1" date="2026-06-30">
                <description>
                  <p>Initial flatpak release</p>
                </description>
              </release>
            </releases>
          </component>
          EOF

    sources:
      # deno CLI (x86_64)
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.8.3/deno-x86_64-unknown-linux-gnu.zip
        sha256: 30455b845ffa6082209c3590269c910ad3b7efdf28c9879afd4006c47ae54197
        strip-components: 1
        only-arches:
          - x86_64
      # denort runtime (x86_64)
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.8.3/denort-x86_64-unknown-linux-gnu.zip
        sha256: 214d0a4010c9c44326a82ea7fc3785c189a43cd83567d91aaa4dce3964759954
        strip-components: 1
        only-arches:
          - x86_64
      # deno CLI (aarch64)
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.8.3/deno-aarch64-unknown-linux-gnu.zip
        sha256: d4589cc1ffcbf1995c92a0127d932aaf832ac70cfdcc6d5b7bf38043cf303575
        strip-components: 1
        only-arches:
          - aarch64
      # denort runtime (aarch64)
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.8.3/denort-aarch64-unknown-linux-gnu.zip
        sha256: 5acc74a4b1a191a88a9ce0b66cfa7e077b50352c124629d5186c5711df462415
        strip-components: 1
        only-arches:
          - aarch64

      # Local source code
      - type: dir
        path: ..

      # Vendored JSR dependencies
      - deno-sources.json
